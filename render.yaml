services:
  - type: web
    name: packageguard-api
    runtime: node
    rootDir: packageguard-api
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set these manually in the Render dashboard (sensitive values):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      # Supabase Storage (evidence photos):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      # Optional — set in dashboard when ready:
      # - key: SENDGRID_API_KEY
      #   sync: false
      # - key: AI_ANALYSIS_ENABLED
      #   value: false
