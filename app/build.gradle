plugins {
    id "com.android.application"
    id "com.google.dagger.hilt.android"
}

android {
    namespace "io.packageguard.app"
    compileSdk 34

    defaultConfig {
        applicationId "io.packageguard.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ── Local dev default: Android emulator → host machine API on port 4000 ──
        // For emulator: http://10.0.2.2:4000
        // For device-on-LAN: change to e.g. "http://192.168.x.x:4000"
        // For production (Render): use "https://your-render-service.onrender.com"
        buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:4000"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // ── Production API — update this to your Render service URL ──────────
            buildConfigField "String", "API_BASE_URL", '"https://packageguard.onrender.com"'
        }
        debug {
            applicationIdSuffix ".debug"
            // ── Local dev: emulator → host on port 4000 ──────────────────────────
            buildConfigField "String", "API_BASE_URL", '"https://packageguard.onrender.com"'
//            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:4000"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core Android
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"

    // Lifecycle / MVVM
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // CameraX
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    // Play Integrity
    implementation "com.google.android.play:integrity:1.3.0"

    // QR / ML Kit
    implementation "com.google.mlkit:barcode-scanning:17.2.0"

    // Image loading
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Secure storage
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // WorkManager
    implementation "androidx.work:work-runtime:2.9.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.51"
    annotationProcessor "com.google.dagger:hilt-android-compiler:2.51"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}

